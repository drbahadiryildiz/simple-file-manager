name: Hata bildirimi
description: Uygulamada karşılaştığınız bir sorunu bildirin
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Uygulama sürümü
      placeholder: "1.3.4"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Cihaz ve Android sürümü
      placeholder: "Redmi ..., Android ..."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Yeniden üretme adımları
      description: Soruna ulaşmak için hangi adımları izlediniz?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Beklenen davranış
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Gerçekleşen davranış / hata mesajı
    validations:
      required: true
