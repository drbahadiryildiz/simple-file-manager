name: Create v1.4.0 draft release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/create-v1.4.0-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v1.4.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v1.4.0 already exists."
            exit 0
          fi

          gh release create v1.4.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Simple File Manager v1.4.0" \
            --notes-file ".github/RELEASE_TEMPLATE_v1.4.0.md" \
            --draft
